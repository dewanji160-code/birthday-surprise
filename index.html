<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Untukmu ❤️</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Ambient background: bokeh + floating hearts, filled by JS -->
<div class="ambient" id="ambient"></div>

<!-- ============== LOCK SCREEN ============== -->
<div id="lock-screen">
  <div class="lock-card">
    <span class="lock-eyebrow" id="lock-eyebrow">Sebelum masuk...</span>
    <h1 class="lock-title" id="lock-subtitle-main">Ada sesuatu yang khusus buat kamu ❤️</h1>

    <div class="pin-dots" id="pin-dots"></div>
    <div class="lock-message" id="lock-message"></div>

    <div class="keypad" id="keypad">
      <!-- generated by JS -->
    </div>
  </div>
</div>

<!-- Wax seal / heart burst transition -->
<div class="seal-burst" id="seal-burst">
  <span class="seal-heart">❤</span>
</div>

<canvas id="confetti-canvas"></canvas>

<!-- ============== MAIN CONTENT ============== -->
<main id="main-content">

  <!-- HERO -->
  <section id="hero">
    <div class="profile-wrap">
      <img class="profile-photo" id="profile-photo" src="images/profile.jpg" alt="Foto profil" />
    </div>
    <h1 class="hero-title" id="hero-title" style="margin-top:30px;">
      Happy Birthday<span class="name" id="hero-name">Sayang</span>
    </h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
    <span class="scroll-hint">scroll ↓</span>
  </section>

  <!-- FOR YOU / LETTER -->
  <section class="section" id="for-you">
    <span class="section-eyebrow reveal-on-scroll">For You</span>
    <h2 class="section-title reveal-on-scroll" id="for-you-title"></h2>
    <div class="letter-paper reveal-on-scroll">
      <p class="letter-text" id="letter-text"></p>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="section" id="gallery">
    <span class="section-eyebrow reveal-on-scroll">Our Little Memories</span>
    <h2 class="section-title reveal-on-scroll" id="gallery-title"></h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- MOMENTS / TIMELINE -->
  <section class="section" id="moments">
    <span class="section-eyebrow reveal-on-scroll">Moments</span>
    <h2 class="section-title reveal-on-scroll" id="moments-title"></h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- INTERACTIVE SURPRISE -->
  <section class="section seal-card" id="surprise">
    <button class="seal-button" id="seal-button" aria-label="Buka kejutan">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7.5-4.6-10-9.3C.5 8 2 4.5 5.4 4c2.2-.3 4 .8 6.6 3.4C14.6 4.8 16.4 3.7 18.6 4c3.4.5 4.9 4 2.4 7.7C19.5 16.4 12 21 12 21Z" stroke="#fbeee7" stroke-width="1.4" fill="rgba(255,255,255,0.15)"/>
      </svg>
    </button>
    <p class="seal-prompt" id="seal-prompt"></p>
    <div class="seal-reveal" id="seal-reveal">
      <p class="seal-reveal-text" id="seal-reveal-text"></p>
      <img id="seal-reveal-img" alt="" />
    </div>
  </section>

  <!-- FINAL SURPRISE -->
  <section id="final">
    <p class="final-pretext" id="final-pretext"></p>
    <h2 class="final-title" id="final-title"></h2>
    <p class="final-message" id="final-message"></p>
    <img class="final-photo" id="final-photo" alt="Foto kenangan" />
    <span class="final-big-heart">❤</span>
    <p class="final-signature" id="final-signature"></p>
  </section>

</main>

<!-- Lightbox -->
<div id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Tutup">✕</button>
  <div>
    <img id="lightbox-img" src="" alt="" />
    <p id="lightbox-caption"></p>
  </div>
</div>

<!-- Music control -->
<button id="music-toggle" aria-label="Kontrol musik">🎵</button>
<audio id="bg-music" loop preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
