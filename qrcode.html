<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buat QR Code ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Poppins:wght@300;400;500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #3a1526 0%, #170a10 65%);
    color: #fbeee7;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.8rem;
    margin-bottom: 6px;
  }
  p.hint {
    font-size: 0.8rem;
    color: #d98da2;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #d8b784;
    margin-bottom: 8px;
    text-align: left;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(216,183,132,0.35);
    background: rgba(255,255,255,0.04);
    color: #fbeee7;
    font-size: 0.9rem;
    margin-bottom: 22px;
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #d98da2, #b95c74);
    color: #fff;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-bottom: 30px;
  }

  /* Heart-shaped frame around the QR code */
  .qr-frame {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-frame::before {
    content: "";
    position: absolute;
    inset: -14px;
    background: linear-gradient(135deg, #d98da2, #b95c74);
    clip-path: path('M150 40 C 110 -20, 10 10, 10 90 C 10 170, 90 220, 150 290 C 210 220, 290 170, 290 90 C 290 10, 190 -20, 150 40 Z');
    opacity: 0.9;
  }
  #qr-canvas-holder {
    position: relative;
    width: 240px;
    height: 240px;
    background: #fdf1f0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .download-btn {
    display: inline-block;
    background: transparent;
    border: 1px solid #d8b784;
    color: #d8b784;
  }

  .note {
    font-size: 0.72rem;
    color: rgba(251,238,231,0.6);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Buat QR Code ❤️</h1>
  <p class="hint">QR ini akan mengarah ke website ucapan ulang tahunmu.</p>

  <label for="url-input">Link website</label>
  <input type="text" id="url-input" placeholder="https://website-kamu.com" />

  <button id="generate-btn">Buat QR Code</button>

  <div class="qr-frame">
    <div id="qr-canvas-holder"></div>
  </div>

  <button class="download-btn" id="download-btn">Unduh QR Code (PNG)</button>

  <p class="note">
    Desain QR sengaja dibuat dengan warna & bentuk romantis, tapi tetap
    memakai tingkat koreksi error tinggi agar tetap mudah dipindai kamera HP.
    Jika kamu mengganti warna/logo sendiri, selalu tes scan sebelum dicetak.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script>
  // Ambil default URL dari config.js jika file ini dibuka bersama project
  let defaultUrl = "https://YOUR-WEBSITE-URL.com";
  try {
    // config.js tidak selalu ada di scope halaman ini, jadi ini opsional
  } catch (e) {}

  const urlInput = document.getElementById('url-input');
  urlInput.value = defaultUrl;

  const holder = document.getElementById('qr-canvas-holder');

  // Small heart logo as inline SVG data URI (center of QR)
  const heartLogo = "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 21s-7.5-4.6-10-9.3C.5 8 2 4.5 5.4 4c2.2-.3 4 .8 6.6 3.4C14.6 4.8 16.4 3.7 18.6 4c3.4.5 4.9 4 2.4 7.7C19.5 16.4 12 21 12 21Z" fill="#b95c74"/>
    </svg>
  `);

  let qrCode;

  function renderQR(url) {
    holder.innerHTML = '';
    qrCode = new QRCodeStyling({
      width: 240,
      height: 240,
      data: url || defaultUrl,
      margin: 6,
      qrOptions: { errorCorrectionLevel: 'H' },
      dotsOptions: {
        type: 'rounded',
        color: '#b95c74'
      },
      cornersSquareOptions: {
        type: 'extra-rounded',
        color: '#7a2f45'
      },
      cornersDotOptions: {
        type: 'dot',
        color: '#7a2f45'
      },
      backgroundOptions: {
        color: '#fdf1f0'
      },
      image: heartLogo,
      imageOptions: {
        crossOrigin: 'anonymous',
        imageSize: 0.22,
        margin: 4
      }
    });
    qrCode.append(holder);
  }

  renderQR(defaultUrl);

  document.getElementById('generate-btn').addEventListener('click', () => {
    const val = urlInput.value.trim() || defaultUrl;
    renderQR(val);
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    if (qrCode) {
      qrCode.download({ name: 'qr-birthday-love', extension: 'png' });
    }
  });
</script>
</body>
</html>
